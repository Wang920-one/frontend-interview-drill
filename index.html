<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>八股抽背 · 手绘笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Patrick+Hand&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#2f2a25; --paper:#fbf7ed; --paper2:#fffdf7;
    --line:#c9bfa8; --red:#e4572e; --blue:#2e86d6; --green:#3aa655;
    --yellow:#ffe066; --orange:#f4933c; --pink:#e26d9c;
    --dot: rgba(47,42,37,.06);
    --shadow: 3px 4px 0 rgba(47,42,37,.18);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Patrick Hand','ZCOOL KuaiLe', cursive;
    color:var(--ink);
    background-color: var(--paper);
    background-image: radial-gradient(var(--dot) 2.2px, transparent 2.6px);
    background-size: 24px 24px;
    background-position: 0 0;
    min-height:100vh;
  }
  .app{ max-width:480px; margin:0 auto; padding:30px 16px 52px; position:relative; z-index:1; }

  /* 手绘方框 */
  .sketch{ background:var(--paper2); border:2.5px solid var(--ink);
    border-radius:255px 14px 225px 14px/14px 225px 14px 255px; box-shadow:var(--shadow); }

  .section-label{ font-size:20px; margin:16px 0 8px; color:#7a7066; }
  .section-label::before{ content:"✎ "; color:var(--red); }

  /* 每日计划 */
  .plan{ padding:14px 16px; margin-bottom:6px; }
  .plan h3{ font-family:'Ma Shan Zheng',cursive; font-size:24px; margin:0 0 8px; }
  .plan-row{ display:flex; align-items:center; gap:8px; font-size:21px; margin-bottom:8px; }
  .plan-row input{ width:74px; font-family:inherit; font-size:22px; text-align:center;
    background:#fffdf7; border:2.5px solid var(--ink); border-radius:12px 4px 12px 4px; padding:4px 6px; color:var(--ink); }
  .plan-info{ font-size:19px; color:#5c524a; }
  .plan-info b{ color:var(--blue); font-size:22px; }
  .today{ margin-top:10px; font-size:19px; }
  .today b{ color:var(--green); }
  .tbar{ height:18px; background:#fff; border:2.5px solid var(--ink); border-radius:10px; margin-top:5px; padding:2px; }
  .tbar > i{ display:block; height:100%; width:0%; background:repeating-linear-gradient(90deg,var(--green) 0 7px,#bfe6c4 7px 9px);
    border-radius:6px; transition:width .4s; }

  /* 模块选择按钮 */
  .modbtn{ width:100%; font-family:inherit; font-size:21px; color:var(--ink);
    background:var(--paper2); border:2.5px solid var(--ink); border-radius:14px 5px 14px 5px;
    box-shadow:var(--shadow); padding:11px 14px; cursor:pointer; text-align:left;
    display:flex; justify-content:space-between; align-items:center; transform:rotate(-.4deg); }
  .modbtn .cur{ color:var(--blue); font-size:20px; }
  .modbtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.15); }

  /* 左侧抽屉 */
  .drawer-mask{ position:fixed; inset:0; background:rgba(40,36,30,.5); opacity:0; visibility:hidden;
    transition:opacity .3s; z-index:30; }
  .drawer-mask.show{ opacity:1; visibility:visible; }
  .drawer{ position:fixed; top:0; left:0; height:100vh; width:82%; max-width:320px;
    background:var(--paper); border-right:3px solid var(--ink); box-shadow:6px 0 0 rgba(47,42,37,.12);
    transform:translateX(-103%); transition:transform .3s ease; z-index:31; display:flex; flex-direction:column; }
  .drawer.show{ transform:translateX(0); }
  .drawer-head{ font-family:'Ma Shan Zheng',cursive; font-size:26px; padding:20px 18px 12px;
    border-bottom:2.5px dashed var(--line); display:flex; justify-content:space-between; align-items:center; }
  .drawer-head .x{ font-family:inherit; font-size:22px; cursor:pointer; color:var(--red); }
  .drawer-list{ flex:1; overflow-y:auto; padding:10px 14px 24px; -webkit-overflow-scrolling:touch; }
  .drawer-item{ font-size:21px; padding:13px 12px; margin:6px 0; background:var(--paper2);
    border:2.5px solid var(--ink); border-radius:14px 5px 14px 5px; box-shadow:var(--shadow);
    cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .drawer-item .cnt{ color:#9a8f80; font-size:18px; }
  .drawer-item.on{ background:var(--yellow); }
  .drawer-item:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.15); }

  /* 模式 */
  .modes{ display:flex; gap:8px; margin:6px 0 14px; }
  .mode{ flex:1; text-align:center; font-size:20px; padding:9px 4px; background:var(--paper2);
    border:2.5px solid var(--ink); border-radius:14px 5px 14px 5px; box-shadow:var(--shadow);
    cursor:pointer; transform:rotate(-.5deg); }
  .mode:nth-child(2){ transform:rotate(.6deg); }
  .mode:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.15); }
  .mode.on{ background:var(--yellow); }

  /* 卡片 */
  .stage{ perspective:1200px; margin-bottom:12px; }
  .card{ position:relative; width:100%; height:64vh; min-height:300px; transform-style:preserve-3d;
    transition:transform .45s ease; cursor:pointer; }
  .card.flip{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--paper2); border:3px solid var(--ink); border-radius:18px 6px 18px 6px;
    box-shadow:4px 5px 0 rgba(47,42,37,.2); padding:16px; display:flex; flex-direction:column;
    overflow:hidden; }
  .face.back{ transform:rotateY(180deg); background:#fffef6; }
  .face-tag{ align-self:flex-start; font-size:18px; background:var(--ink); color:var(--paper);
    padding:3px 9px; border-radius:8px 2px 8px 2px; transform:rotate(-1deg); flex:none; }
  .face-idx{ position:absolute; top:12px; right:14px; font-size:18px; color:#9a8f80; }
  .q{ font-size:25px; line-height:1.45; margin-top:14px; }
  .a{ font-size:21px; line-height:1.6; margin-top:12px; white-space:pre-line;
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-right:4px; }
  .a b{ color:var(--red); }
  .hint{ margin-top:auto; font-size:17px; color:#b3a896; text-align:center; }
  .empty{ text-align:center; font-size:23px; color:#9a8f80; padding:70px 10px; }

  /* 评分 */
  .rates{ display:flex; gap:8px; margin-bottom:12px; }
  .rate{ flex:1; text-align:center; font-size:20px; padding:12px 2px; border:2.5px solid var(--ink);
    border-radius:14px 5px 14px 5px; box-shadow:var(--shadow); cursor:pointer; transform:rotate(.5deg); }
  .rate:nth-child(2){ transform:rotate(-.6deg); }
  .rate:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.15); }
  .rate.no{ background:var(--red); color:#fff; }
  .rate.fz{ background:var(--yellow); }
  .rate.ok{ background:var(--green); color:#fff; }
  .rate.picked{ outline:3px dashed var(--blue); outline-offset:2px; }

  /* 导航 */
  .nav{ display:flex; gap:8px; }
  .btn{ flex:1; text-align:center; font-size:20px; background:var(--paper2); color:var(--ink);
    border:2.5px solid var(--ink); border-radius:14px 5px 14px 5px; box-shadow:var(--shadow);
    padding:13px 4px; cursor:pointer; }
  .btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.15); }
  .btn.rand{ background:var(--pink); color:#fff; }
  .btn:disabled{ opacity:.4; }

  /* 统计浮层 */
  .overlay{ position:fixed; inset:0; background:rgba(40,36,30,.55); display:none;
    align-items:center; justify-content:center; padding:18px; z-index:20; }
  .overlay.show{ display:flex; }
  .stats{ width:100%; max-width:440px; max-height:84vh; overflow:auto; background:var(--paper2);
    border:3px solid var(--ink); border-radius:20px 8px 20px 8px; box-shadow:6px 7px 0 rgba(0,0,0,.25); padding:18px; }
  .stats h2{ font-family:'Ma Shan Zheng',cursive; font-size:26px; margin:0 0 4px; }
  .stats .total{ font-size:19px; color:#5c524a; margin-bottom:12px; }
  .row{ margin:10px 0; }
  .row .name{ font-size:19px; display:flex; justify-content:space-between; }
  .row .name span:last-child{ color:var(--green); }
  .sbar{ height:15px; background:#fff; border:2.5px solid var(--ink); border-radius:8px; margin-top:4px; padding:2px; }
  .sbar > i{ display:block; height:100%; width:0%; background:repeating-linear-gradient(90deg,var(--green) 0 7px,#bfe6c4 7px 9px); border-radius:5px; transition:width .4s; }
  .closebtn{ margin-top:16px; width:100%; font-size:21px; background:var(--red); color:#fff;
    border:2.5px solid var(--ink); border-radius:14px 5px 14px 5px; box-shadow:var(--shadow); padding:12px; cursor:pointer; }
  .closebtn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.15); }

  .foot{ margin-top:18px; font-size:19px; color:#7a7066; text-align:center; }
  .foot a{ color:var(--blue); text-decoration:underline wavy; }

  /* 装饰涂鸦 */
  .deco{ position:fixed; z-index:0; pointer-events:none; }
  .deco1{ top:16px; right:18px; opacity:.6; }
  .deco2{ bottom:64px; left:14px; opacity:.5; }
  .deco3{ top:44%; right:8px; opacity:.42; }

  /* 交互动效 */
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes shake{ 0%,100%{ transform:rotate(0); } 20%{ transform:rotate(-11deg); } 40%{ transform:rotate(9deg); } 60%{ transform:rotate(-6deg); } 80%{ transform:rotate(4deg); } }
  @keyframes glow{ from{ filter:brightness(1); } to{ filter:brightness(1.2); } }
  .tbar.full > i{ animation: glow 1s ease-in-out infinite alternate; }
  .drawer-item:hover{ transform:translateX(4px); }
  .mode{ transition:transform .15s ease, background .2s; }
</style>
</head>
<body>
<!-- 手绘涂鸦装饰 -->
<div class="deco deco1"><svg width="44" height="44" viewBox="0 0 42 42"><path d="M21 5 L25 17 L37 18 L27 26 L30 39 L21 31 L12 39 L15 26 L5 18 L17 17 Z" fill="none" stroke="#e4572e" stroke-width="3" stroke-linejoin="round" transform="rotate(-8 21 21)"/></svg></div>
<div class="deco deco2"><svg width="52" height="30" viewBox="0 0 50 30"><path d="M4 15 q8 -13 16 0 t16 0 t16 0" fill="none" stroke="#2e86d6" stroke-width="3" stroke-linecap="round"/></svg></div>
<div class="deco deco3"><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="9" fill="none" stroke="#3aa655" stroke-width="3"/><g stroke="#3aa655" stroke-width="3" stroke-linecap="round"><line x1="20" y1="3" x2="20" y2="9"/><line x1="20" y1="31" x2="20" y2="37"/><line x1="3" y1="20" x2="9" y2="20"/><line x1="31" y1="20" x2="37" y2="20"/></g></svg></div>

<div class="app">
  <!-- 每日计划 -->
  <div class="plan sketch">
    <h3>📅 每日计划</h3>
    <div class="plan-row">每天背
      <input id="goalInput" type="number" min="1" max="999" value="20" /> 题
    </div>
    <div class="plan-info">全部 <b id="planTotal">0</b> 题 · 预计 <b id="planDays">0</b> 天背完</div>
    <div class="today">今日已背 <b id="todayDone">0</b> / <b id="todayGoal">20</b>
      <div class="tbar"><i id="todayBar"></i></div>
      还差 <span id="todayLeft">20</span> 题达标 ✦
    </div>
  </div>

  <div class="section-label">选择模块</div>
  <div class="modbtn" id="modBtn">📂 模块：<span class="cur" id="modCur">全部模块</span></div>

  <div class="section-label">复习模式</div>
  <div class="modes" id="modes">
    <div class="mode on" data-mode="seq">顺序</div>
    <div class="mode" data-mode="rand">抽背</div>
    <div class="mode" data-mode="wrong">错题本</div>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="face-tag" id="qTag">MODULE</div>
        <div class="face-idx" id="qIdx">0/0</div>
        <div class="q" id="qText">—</div>
        <div class="hint">👆 点卡片翻看解析</div>
      </div>
      <div class="face back">
        <div class="face-tag" id="aTag">ANSWER</div>
        <div class="a" id="aText">—</div>
        <div class="hint">👈 点卡片收起</div>
      </div>
    </div>
  </div>

  <div class="rates">
    <div class="rate no" data-rate="unknown">不会</div>
    <div class="rate fz" data-rate="fuzzy">模糊</div>
    <div class="rate ok" data-rate="know">掌握</div>
  </div>

  <div class="nav">
    <div class="btn" id="prevBtn">◀ 上一题</div>
    <div class="btn rand" id="randBtn">🎲 抽背</div>
    <div class="btn" id="nextBtn">下一题 ▶</div>
  </div>

  <div class="foot"><a id="statsLink">▣ 看模块统计</a></div>
</div>

<div class="overlay" id="overlay">
  <div class="stats">
    <h2>模块掌握统计</h2>
    <div class="total" id="statsTotal">—</div>
    <div id="statsBody"></div>
    <div class="closebtn" id="closeStats">关闭 ✕</div>
  </div>
</div>

<!-- 左侧模块抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">📚 选择模块 <span class="x" id="drawerClose">✕</span></div>
  <div class="drawer-list" id="drawerList"></div>
</div>

<script>
const MODULES = [
  {id:'js',name:'JavaScript 基础'},{id:'css',name:'CSS & HTML'},{id:'browser',name:'浏览器 & 性能'},
  {id:'vue',name:'Vue'},{id:'react',name:'React'},{id:'ts',name:'TypeScript'},
  {id:'build',name:'工程化 & 构建'},{id:'viz',name:'可视化 & 大屏'},{id:'three',name:'Three.js & 3D'},
  {id:'cross',name:'跨端 & 移动'},{id:'node',name:'Node & 全栈'},{id:'ai',name:'AI 应用开发'},
  {id:'net',name:'网络 & 安全'},{id:'algo',name:'算法 & 数据结构'},{id:'resume',name:'项目深挖'}
];
const MOD_NAME = Object.fromEntries(MODULES.map(m=>[m.id,m.name]));

/* 题库：解析较详细，结构 = build_questions.py 生成格式 {id,module,q,a} */
let QUESTIONS = []; // 题目数据改为从 ./data/<module>.json 按需加载（见底部 boot）


/* ====== 状态 ====== */
const LS_PROG='drill-progress-v1', LS_TODAY='drill-today', LS_GOAL='drill-goal';
let progress = JSON.parse(localStorage.getItem(LS_PROG)||'{}');
let goal = parseInt(localStorage.getItem(LS_GOAL))||20;
let today = JSON.parse(localStorage.getItem(LS_TODAY)||'{}');
let curModule='all', curMode='seq', list=[], pos=0, pool=[];

const $ = s=>document.querySelector(s);
const elCard=$('#card');
const todayStr=()=>new Date().toISOString().slice(0,10);
function ensureToday(){ if(today.date!==todayStr()) today={date:todayStr(), ids:[]}; }
function saveToday(){ localStorage.setItem(LS_TODAY, JSON.stringify(today)); }
function bumpToday(id, on){ ensureToday(); const i=today.ids.indexOf(id); if(on){ if(i<0) today.ids.push(id); } else { if(i>=0) today.ids.splice(i,1); } saveToday(); updatePlan(); }

/* 模块抽屉 */
function renderDrawer(){
  let h=`<div class="drawer-item ${curModule==='all'?'on':''}" data-m="all">全部模块 <span class="cnt">${QUESTIONS.length}</span></div>`;
  for(const m of MODULES){
    const n=QUESTIONS.filter(q=>q.module===m.id).length;
    h+=`<div class="drawer-item ${curModule===m.id?'on':''}" data-m="${m.id}">${m.name} <span class="cnt">${n}</span></div>`;
  }
  const dl=$('#drawerList'); dl.innerHTML=h;
  dl.querySelectorAll('.drawer-item').forEach(it=>it.onclick=()=>{
    curModule=it.dataset.m; renderDrawer(); closeDrawer(); buildList();
  });
  $('#modCur').textContent = curModule==='all'?'全部模块':MOD_NAME[curModule];
}
function openDrawer(){ $('#drawer').classList.add('show'); $('#drawerMask').classList.add('show'); }
function closeDrawer(){ $('#drawer').classList.remove('show'); $('#drawerMask').classList.remove('show'); }
$('#modBtn').onclick=openDrawer;
$('#drawerClose').onclick=closeDrawer;
$('#drawerMask').onclick=closeDrawer;

function buildList(){
  const base = curModule==='all'?QUESTIONS:QUESTIONS.filter(q=>q.module===curModule);
  list = curMode==='wrong'? base.filter(q=>progress[q.id]&&progress[q.id]!=='know') : base.slice();
  pos=0; pool=list.slice();
  if(list.length===0){ showEmpty(); updateProgress(); return; }
  showCard(); updateProgress();
}
function showEmpty(){ elCard.querySelector('.front').innerHTML=`<div class="face-tag">EMPTY</div><div class="empty">本题库暂无题目\n换个模块或去「抽背」试试 ✦</div>`; elCard.classList.remove('flip'); }
function hl(a){ return a.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function showCard(){
  const q=list[pos]; if(!q){ showEmpty(); return; }
  const n=list.length;
  elCard.querySelector('.front').innerHTML=`<div class="face-tag">${MOD_NAME[q.module]||q.module}</div><div class="face-idx">${pos+1}/${n}</div><div class="q">${q.q}</div><div class="hint">👆 点卡片翻看解析</div>`;
  const qEl=elCard.querySelector('.front .q');
  qEl.style.animation='none'; void qEl.offsetWidth; qEl.style.animation='fadeUp .35s ease';
  $('#aTag').textContent='解析 · '+(MOD_NAME[q.module]||q.module);
  $('#aText').innerHTML=hl(q.a);
  elCard.classList.remove('flip');
  document.querySelectorAll('.rate').forEach(r=>r.classList.toggle('picked', progress[q.id]===r.dataset.rate));
  $('#prevBtn').disabled=(pos===0); $('#nextBtn').disabled=(pos===n-1);
}

function updateProgress(){
  const totalAll=QUESTIONS.length, reviewed=Object.keys(progress).length;
  const known=Object.values(progress).filter(v=>v==='know').length;
  const pct=reviewed?Math.round(known/reviewed*100):0;
  // 顶部进度放在统计里，这里更新计划区
  updatePlan();
}

function updatePlan(){
  ensureToday();
  const total=QUESTIONS.length;
  goal=parseInt($('#goalInput').value)||goal;
  const days=Math.ceil(total/goal);
  $('#planTotal').textContent=total;
  $('#planDays').textContent=days;
  $('#todayGoal').textContent=goal;
  const done=today.ids.length;
  $('#todayDone').textContent=done;
  $('#todayLeft').textContent=Math.max(0,goal-done);
  $('#todayBar').style.width=Math.min(100, goal?done/goal*100:0)+'%';
  $('#todayBar').parentElement.classList.toggle('full', done>=goal && goal>0);
}

/* 翻牌 */
elCard.onclick=()=>{
  const wasFlipped=elCard.classList.contains('flip');
  elCard.classList.toggle('flip');
  if(!wasFlipped){ const aEl=$('#aText'); aEl.style.animation='none'; void aEl.offsetWidth; aEl.style.animation='fadeUp .35s ease'; }
};

/* 评分 */
document.querySelectorAll('.rate').forEach(r=>r.onclick=()=>{
  const q=list[pos]; if(!q) return; const v=r.dataset.rate;
  if(progress[q.id]===v){ delete progress[q.id]; bumpToday(q.id,false); }
  else { progress[q.id]=v; bumpToday(q.id,true); }
  localStorage.setItem(LS_PROG, JSON.stringify(progress)); showCard(); updateProgress();
});

/* 模式 */
document.querySelectorAll('.mode').forEach(m=>m.onclick=()=>{
  document.querySelectorAll('.mode').forEach(x=>x.classList.remove('on')); m.classList.add('on');
  curMode=m.dataset.mode; buildList();
});

$('#prevBtn').onclick=()=>{ if(pos>0){ pos--; showCard(); } };
$('#nextBtn').onclick=()=>{ if(pos<list.length-1){ pos++; showCard(); } };
$('#randBtn').onclick=()=>{ if(list.length===0) return; if(pool.length===0) pool=list.slice();
  const i=Math.floor(Math.random()*pool.length); const pick=pool.splice(i,1)[0]; pos=list.indexOf(pick); showCard();
  const b=$('#randBtn'); b.style.animation='none'; void b.offsetWidth; b.style.animation='shake .4s ease'; };

/* 每日目标 */
$('#goalInput').value=goal;
$('#goalInput').onchange=()=>{ goal=parseInt($('#goalInput').value)||1; localStorage.setItem(LS_GOAL,goal); updatePlan(); };

/* 统计浮层 */
function openStats(){
  let body='', reviewed=0, known=0;
  for(const m of MODULES){
    const arr=QUESTIONS.filter(q=>q.module===m.id);
    const rv=arr.filter(q=>progress[q.id]).length, kn=arr.filter(q=>progress[q.id]==='know').length;
    reviewed+=rv; known+=kn;
    const pct=rv?Math.round(kn/rv*100):0;
    body+=`<div class="row"><div class="name"><span>${m.name}</span><span>${kn}/${arr.length}</span></div><div class="sbar"><i style="width:${arr.length?rv/arr.length*100:0}%"></i></div></div>`;
  }
  $('#statsTotal').textContent=`已评 ${reviewed}/${QUESTIONS.length} 题 · 掌握 ${known}`;
  $('#statsBody').innerHTML=body; $('#overlay').classList.add('show');
}
$('#statsLink').onclick=openStats;
$('#closeStats').onclick=()=>$('#overlay').classList.remove('show');
$('#overlay').onclick=e=>{ if(e.target.id==='overlay') $('#overlay').classList.remove('show'); };

boot();
// 启动时从各模块 JSON 加载题目（GitHub Pages / 本地服务器均可；file:// 双击会被 CORS 拦截）
async function boot(){
  try{
    const parts = await Promise.all(MODULES.map(m =>
      fetch('./data/'+m.id+'.json').then(r => r.ok ? r.json() : []).catch(()=>[])
    ));
    QUESTIONS = [].concat(...parts);
  }catch(e){ QUESTIONS = []; }
  if(!QUESTIONS.length){
    const tip=document.createElement('div');
    tip.style.cssText='position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#fff3cd;color:#7a5b00;padding:10px 14px;border:2px solid #e0c068;border-radius:10px;max-width:92%;font-size:13px;z-index:999;text-align:center';
    tip.textContent='题目数据加载失败：请通过 GitHub Pages 或本地服务器访问（直接双击打开 file:// 无法加载数据）。';
    document.body.appendChild(tip);
  }
  renderDrawer(); buildList(); updatePlan();
}

</script>
